<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Iniciar sesión · AppControl</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="theme-color" content="#0B0F14"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--card:#10151C;--amber:#FFB020;--text:#EAF0F6;--muted:#93A1B0;--border:#202A36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.shell{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:880px;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.art{position:relative;background:linear-gradient(160deg,#0E2136,#0B0F14);display:flex;align-items:flex-end;justify-content:center;padding:30px;overflow:hidden}
.art .copy{position:absolute;top:34px;left:34px;right:20px}
.art h2{font-family:"Space Grotesk";font-size:26px;line-height:1.15;letter-spacing:-.01em}
.art p{color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.6}
.win{animation:blink 4s infinite}.win:nth-child(2n){animation-delay:1.4s}.win:nth-child(3n){animation-delay:2.6s}
@keyframes blink{0%,100%{opacity:.12}50%{opacity:.9}}
.hook{animation:drop 6s ease-in-out infinite}@keyframes drop{50%{transform:translateY(12px)}}
.form-side{padding:44px 40px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:19px}
.logo em{font-style:normal;color:var(--amber)}
h1{font-family:"Space Grotesk";font-size:26px;margin:22px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin:16px 0 6px;letter-spacing:.03em}
input{width:100%;padding:13px 15px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;min-height:48px}
input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.12)}
.btn{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--amber),#FF8A00);border:none;color:#10141A;font-weight:700;padding:14px;border-radius:10px;font-size:15px;cursor:pointer;min-height:48px;transition:.25s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,138,0,.3)}
.btn:disabled{opacity:.7;transform:none}
.err{margin-top:14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#EF4444;padding:11px 14px;border-radius:8px;font-size:13px;display:none}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}
.back:hover{color:var(--amber)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.art{display:none}.form-side{padding:34px 26px}}
</style>
</head>
<body>
<div class="shell">
  <div class="art" aria-hidden="true">
    <div class="copy">
      <h2>El pulso de la obra,<br/>en tu bolsillo.</h2>
      <p>Registra en el recorrido, incluso sin señal. AppControl sincroniza por ti.</p>
    </div>
    <svg width="260" height="260" viewBox="0 0 260 260" fill="none">
      <rect x="60" y="70" width="90" height="190" fill="#12283F"/>
      <rect x="160" y="120" width="70" height="140" fill="#0E2136"/>
      <g fill="#FFB020">
        <rect class="win" x="72" y="86" width="12" height="14"/><rect class="win" x="96" y="86" width="12" height="14"/><rect class="win" x="120" y="86" width="12" height="14"/>
        <rect class="win" x="72" y="116" width="12" height="14"/><rect class="win" x="120" y="116" width="12" height="14"/>
        <rect class="win" x="96" y="146" width="12" height="14"/><rect class="win" x="120" y="176" width="12" height="14"/>
        <rect class="win" x="172" y="136" width="10" height="12"/><rect class="win" x="196" y="136" width="10" height="12"/><rect class="win" x="172" y="166" width="10" height="12"/>
      </g>
      <rect x="20" y="40" width="6" height="220" fill="#1D2833"/>
      <rect x="0" y="34" width="150" height="6" rx="2" fill="#FFB020"/>
      <g class="hook"><line x1="120" y1="40" x2="120" y2="70" stroke="#8891A0" stroke-width="2"/><rect x="112" y="70" width="16" height="11" rx="2" fill="#FFB020"/></g>
    </svg>
  </div>
  <form class="form-side" id="f">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="8" fill="#FFB020"/><path d="M9.5 22v-6M16 22V9.5M22.5 22v-9" stroke="#0B0F14" stroke-width="3.4" stroke-linecap="round"/></svg>
      App<em>Control</em>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Residentes, administradores y gerencia</p>
    <label for="u">Usuario</label><input id="u" placeholder="999000111" autocomplete="username"/>
    <label for="p">PIN</label><input id="p" type="password" placeholder="••••" autocomplete="current-password"/>
    <button class="btn" id="b">Entrar</button>
    <div class="err" id="m"></div>
    <a class="back" href="/">← Volver al inicio</a>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = document.getElementById('m'), b = document.getElementById('b');
  m.style.display = 'none'; b.disabled = true; b.textContent = 'Verificando...';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario: document.getElementById('u').value, pin: document.getElementById('p').value }) });
  const d = await r.json();
  b.disabled = false; b.textContent = 'Entrar';
  if (d.success) location.href = '/app.html';
  else { m.textContent = d.codigo === 'CREDENCIALES_INVALIDAS' ? 'Usuario o PIN incorrectos' : 'Error de conexión. Intenta de nuevo.'; m.style.display = 'block'; }
});
</script>
</body>
</html>

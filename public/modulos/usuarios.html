<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Usuarios</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
body{background:transparent;padding:14px;overflow:auto;min-height:0}
body::before{display:none}
.tools{display:grid;grid-template-columns:1.2fr 1.3fr .8fr .7fr auto;gap:10px;align-items:end;margin:16px 0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.on{background:rgba(47,191,113,.14);color:#2FBF71}.off{background:rgba(239,68,68,.14);color:#EF4444}
@media(max-width:850px){.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card" style="margin-top:0">
  <div class="kicker">Administración</div>
  <h2 style="margin:6px 0 4px;font-size:22px">Usuarios y permisos</h2>
  <p style="color:var(--mut);font-size:13px">Crea residentes y visualizadores. Cada usuario recibe una contraseña temporal y debe cambiarla al entrar.</p>

  <div class="tools">
    <div><label>Nombre</label><input id="nombre" placeholder="Nombre completo"/></div>
    <div><label>Correo</label><input id="email" type="email" placeholder="correo@empresa.com"/></div>
    <div><label>Rol</label><select id="rol"><option>RESIDENTE</option><option>VISUALIZADOR</option><option>ADMIN</option></select></div>
    <div><label>Torre</label><input id="torre" value="T1"/></div>
    <button class="btn" id="crear">Crear usuario</button>
  </div>

  <div class="msg" id="m"></div>
  <div class="gridwrap" id="tabla"></div>
</div>

<script src="/js/app.js"></script>
<script>
async function cargar() {
  const d = await api("/api/auth", { method:"POST", body: JSON.stringify({ action:"users-list" }) });
  if (!d.success) {
    document.querySelector(".card").innerHTML = "<p class='msg err'>Solo ADMIN puede administrar usuarios.</p>";
    return;
  }

  let html = "<table class='grid'><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Torre</th><th>Estado</th><th>Acciones</th></tr>";

  for (const u of d.usuarios) {
    html += `<tr>
      <td>${esc(u.NOMBRE)}</td>
      <td>${esc(u.EMAIL)}</td>
      <td>${esc(u.ROL)}</td>
      <td>${esc(u.TORRE)}</td>
      <td><span class='badge ${u.ACTIVO === "SI" ? "on" : "off"}'>${u.ACTIVO === "SI" ? "ACTIVO" : "INACTIVO"}</span></td>
      <td>
        <button class='btn secondary' style='width:auto;padding:8px 10px;margin:0' data-act='toggle' data-email='${esc(u.EMAIL)}' data-activo='${u.ACTIVO === "SI" ? "NO" : "SI"}'>${u.ACTIVO === "SI" ? "Desactivar" : "Activar"}</button>
        <button class='btn secondary' style='width:auto;padding:8px 10px;margin:0' data-act='reset' data-email='${esc(u.EMAIL)}'>Resetear contraseña</button>
      </td>
    </tr>`;
  }

  html += "</table>";
  $("#tabla").innerHTML = html;

  $("#tabla").querySelectorAll("[data-act]").forEach((b) => b.onclick = () => {
    if (b.dataset.act === "toggle") toggle(b.dataset.email, b.dataset.activo);
    else resetPass(b.dataset.email);
  });
}

$("#crear").onclick = async () => {
  const body = {
    nombre: $("#nombre").value.trim(),
    email: $("#email").value.trim(),
    rol: $("#rol").value,
    torre: $("#torre").value.trim() || "*"
  };

  const d = await api("/api/auth", { method:"POST", body: JSON.stringify({ action:"users-create", ...body }) });

  if (d.success) {
    $("#m").className = "msg ok";
    $("#m").innerHTML = `Usuario creado.<br>
      Correo: <b>${esc(d.usuario.email)}</b><br>
      Contraseña temporal: <b>${esc(d.usuario.passwordInicial)}</b> (cópiala ahora, no se vuelve a mostrar)<br>
      Código de acceso generado: <b>${esc(d.usuario.accessCode)}</b><br>
      En la hoja solo queda guardado en hash.`;
    $("#nombre").value = "";
    $("#email").value = "";
    cargar();
  } else {
    $("#m").className = "msg err";
    $("#m").textContent = d.codigo || "Error creando usuario.";
  }
};

async function toggle(email, activo) {
  const d = await api("/api/auth", { method:"POST", body: JSON.stringify({ action:"users-patch", email, activo }) });
  if (!d.success) alert("No fue posible cambiar el estado. " + (d.codigo || ""));
  cargar();
}

async function resetPass(email) {
  const d = await api("/api/auth", { method:"POST", body: JSON.stringify({ action:"users-patch", email, resetPassword: true }) });
  if (d.success && d.passwordTemporal) alert("Contraseña reiniciada a: " + d.passwordTemporal + ". El usuario deberá cambiarla al entrar.");
  else alert(d.success ? "Contraseña reiniciada." : "No fue posible reiniciar la contraseña.");
  cargar();
}

cargar();
</script>
</body>
</html>

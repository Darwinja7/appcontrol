<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0B0F14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>ConfiguraciÃƒÂ³n</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css"/>
<style>
body{background:transparent;padding:14px;overflow:auto;min-height:0}
body::before{display:none}
.c0{background:#2A3138;color:#8891A0}.c1{background:#6E5620;color:#F4E5BE}.c2{background:#245C43;color:#D5EFE2}
.cellbtn{min-width:44px;padding:8px 6px;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:700}
.selring{outline:2px solid var(--amber);outline-offset:2px}
.legend{display:flex;gap:14px;margin:12px 0;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.actions .btn{width:auto;margin:0;padding:10px 16px;font-size:13px}
.actions select{width:auto}
</style>
</head>
<body>
<div class="card" style="margin-top:0">
  <div class="kicker">Capa de control</div>
  <h2 style="margin:6px 0 4px;font-size:22px">Base depurada: quÃƒÂ© se puede ejecutar</h2>
  <p style="color:var(--mut);font-size:13px">HABILITADO = APLICA SÃƒÂ­ + ACTIVO SÃƒÂ­ + CONTRATISTA asignado. Solo lo habilitado aparece en el Grid.</p>
  <label>Proyecto</label><select id="proyecto"></select>
  <label>Torre</label><select id="torre"></select>
  <label>Actividad</label><select id="actividad"></select>
  <div class="legend">
    <span><i style="background:#2A3138"></i>No aplica / sin configurar</span>
    <span><i style="background:#6E5620"></i>Aplica, no habilitado</span>
    <span><i style="background:#245C43"></i>Habilitado</span>
    <span>Ã‚Â· clic = seleccionar varias celdas</span>
  </div>
  <div class="actions">
    <button class="btn secondary" id="aSi">Aplica = SÃƒÂ­</button>
    <button class="btn secondary" id="aNo">Aplica = No</button>
    <button class="btn secondary" id="vSi">Activo = SÃƒÂ­</button>
    <button class="btn secondary" id="vNo">Activo = No</button>
    <select id="contratista"></select>
    <button class="btn secondary" id="aCt">Asignar contratista</button>
    <button class="btn" id="save">Guardar cambios</button>
  </div>
  <div class="gridwrap" id="box"></div>
  <div class="msg" id="m"></div>
</div>
<script src="/js/app.js"></script>
<script>
let D = null, CFG = [], sel = new Set();
const hoy = () => new Date().toISOString().slice(0, 10);
const hab = (r) => r.APLICA === "SI" && r.ACTIVO === "SI" && r.CONTRATISTA && r.CONTRATISTA !== "Sin asignar";
const key = (t, a, n, u) => [t, a, n, u].join("|");
const findRow = (t, a, n, u) => CFG.find((r) => key(r.TORRE, r.ACTIVIDAD, r.NIVEL, r.UNIDAD) === key(t, a, n, u));
async function init() {
  D = await api("/api/data", { method:"POST", body: JSON.stringify({ action:"catalogos" }) });
  if (D.me.rol !== "ADMIN") { document.querySelector(".card").innerHTML = "<p class='msg err'>Solo el rol ADMIN puede configurar.</p>"; return; }
  CFG = D.configuracion.map((r) => ({ ...r }));
  fill($("#proyecto"), D.proyectos, (p) => ({ v: p.CODIGO, t: p.CODIGO + " - " + p.NOMBRE }));
  fill($("#contratista"), D.contratistas, (c) => ({ v: c.CODIGO, t: c.NOMBRE }));
  $("#proyecto").onchange = () => { fill($("#torre"), torres(), (t) => ({ v: t, t })); reset(); };
  $("#torre").onchange = () => { fill($("#actividad"), D.actividades, (a) => ({ v: a.CODIGO, t: a.CODIGO + " - " + a.NOMBRE })); reset(); };
  $("#actividad").onchange = render;
  $("#aSi").onclick = () => bulk((r) => { r.APLICA = "SI"; });
  $("#aNo").onclick = () => bulk((r) => { r.APLICA = "NO"; });
  $("#vSi").onclick = () => bulk((r) => { r.ACTIVO = "SI"; if (!r.FECHA_ACTIVACION) r.FECHA_ACTIVACION = hoy(); r.FECHA_DESACTIVACION = ""; });
  $("#vNo").onclick = () => bulk((r) => { r.ACTIVO = "NO"; r.FECHA_DESACTIVACION = hoy(); });
  $("#aCt").onclick = () => bulk((r) => { r.CONTRATISTA = $("#contratista").value || "Sin asignar"; });
  $("#save").onclick = async () => {
    const d = await api("/api/data", { method:"POST", body: JSON.stringify({ action:"config-save", rows: CFG }) });
    $("#m").textContent = d.success ? "ConfiguraciÃƒÂ³n guardada (" + d.guardadas + " filas). HABILITADO recalculado." : "Error al guardar";
    $("#m").className = "msg " + (d.success ? "ok" : "err");
    render();
  };
}
function torres() { return [...new Set(D.unidades.filter((u) => u.PROYECTO === $("#proyecto").value).map((u) => u.TORRE))]; }
function reset() { sel.clear(); $("#actividad").innerHTML = ""; $("#box").innerHTML = ""; }
function getRow(t, a, n, u) {
  let r = findRow(t, a, n, u);
  if (!r) { const act = D.actividades.find((x) => x.CODIGO === a); r = { PROYECTO: $("#proyecto").value, TORRE: t, ACTIVIDAD: a, CAPITULO: act ? act.CAPITULO : "", NIVEL: String(n), UNIDAD: u, APLICA: "NO", ACTIVO: "SI", CONTRATISTA: "Sin asignar", HABILITADO: "NO", FECHA_ACTIVACION: "", FECHA_DESACTIVACION: "", OBSERVACION: "" }; CFG.push(r); }
  return r;
}
function bulk(fn) { sel.forEach((k) => { const [t, a, n, u] = k.split("|"); fn(getRow(t, a, n, u)); }); sel.clear(); render(); }
function render() {
  const t = $("#torre").value, a = $("#actividad").value;
  if (!t || !a) return;
  const units = D.unidades.filter((u) => u.PROYECTO === $("#proyecto").value && u.TORRE === t && u.ACTIVO === "SI");
  const niveles = [...new Set(units.map((u) => u.NIVEL))].sort((x, y) => +x - +y);
  const cols = [...new Set(units.map((u) => u.UNIDAD))].sort();
  let html = "<table class='grid'><tr><th>NIVEL</th>" + cols.map((c) => `<th>${c}</th>`).join("") + "</tr>";
  for (const n of niveles) {
    html += `<tr><td class='lvl'>${n}</td>`;
    for (const u of cols) {
      const exists = units.some((x) => x.UNIDAD === u && x.NIVEL === n);
      if (!exists) { html += "<td></td>"; continue; }
      const r = findRow(t, a, n, u);
      const cls = !r || r.APLICA !== "SI" ? "c0" : hab(r) ? "c2" : "c1";
      const txt = !r || r.APLICA !== "SI" ? "Ã‚Â·" : hab(r) ? "HAB" : "APL";
      const k = key(t, a, n, u);
      html += `<td><button class='cellbtn ${cls} ${sel.has(k) ? "selring" : ""}' data-k='${k}'>${txt}</button></td>`;
    }
    html += "</tr>";
  }
  html += "</table>";
  $("#box").innerHTML = html;
  $("#box").querySelectorAll(".cellbtn").forEach((b) => b.onclick = () => { const k = b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); render(); });
}
init();
</script>
</body>
</html>

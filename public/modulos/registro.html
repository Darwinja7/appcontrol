<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0B0F14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Registro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css"/>
<style>
body{background:transparent;padding:14px;overflow:auto;min-height:0}
body::before{display:none}
div.cell{display:inline-flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;border-radius:12px;padding:8px 6px;border:2px solid transparent;background:#16202B;transition:.25s;-webkit-tap-highlight-color:transparent;user-select:none}
div.cell:hover{transform:scale(1.05);border-color:#1D3552}
div.cell.sel{border-color:var(--amber);background:rgba(255,176,32,.08);box-shadow:0 0 14px rgba(255,176,32,.35)}
div.cell.pend{border-style:dashed;border-color:var(--amber)}
div.cell .done{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:6px;border:1px solid #202A36;background:#0B0F14;color:#245C43;font-size:12px;font-weight:800;line-height:1;cursor:pointer;padding:0}
div.cell .done.on{background:#245C43;color:#D5EFE2}
div.cell{position:relative}
div.cell .pct{font-size:11px;font-weight:800;color:#EAF0F6;text-shadow:0 1px 2px rgba(0,0,0,.7)}
div.cell .chip{min-width:54px;text-align:center;pointer-events:none}
.avbar{height:8px;border-radius:6px;background:#202A36;overflow:hidden;min-width:52px}
.avbar i{display:block;height:100%;border-radius:6px}
.sel-count{background:var(--amber);color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
.pend-count{background:#31567C;color:#DCEAF7;padding:2px 8px;border-radius:10px;font-size:12px}
.legend{display:flex;gap:10px;margin:10px 0;font-size:11px;color:var(--mut);flex-wrap:wrap;align-items:center}
.legend .chip{cursor:default;pointer-events:none}
.hint{color:var(--mut);font-size:12px;margin-top:4px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.filtros button{background:#16202B;border:1px solid #202A36;color:#93A1B0;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.filtros button.on{background:rgba(255,176,32,.14);border-color:var(--amber);color:var(--amber)}
</style>
</head>
<body>
<div class="card" style="margin-top:0">
  <div class="kicker">Registro de avance</div>
  <label>Filtrar por ámbito</label>
  <div class="filtros" id="filtros">
    <button data-modo="" class="on">Todos</button>
    <button data-modo="UNIDAD">Apartamentos</button>
    <button data-modo="ZONA">Zona punto fijo</button>
    <button data-modo="NIVEL">Especiales por nivel</button>
  </div>
  <label>Actividad (solo habilitadas)</label><select id="actividad"></select>
  <div class="legend">
    <span class="chip st0">Sin empezar 0%</span>
    <span class="chip st1">Replanteo 10%</span>
    <span class="chip st2">En curso 50%</span>
    <span class="chip st3">Remate 80%</span>
    <span class="chip st4">Listo 100%</span>
  </div>
  <div class="hint" id="hintModo"></div>
  <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
    <span id="pend-badge" class="pend-count" style="display:none"></span>
    <span id="sel-badge" class="sel-count" style="display:none">0</span>
  </div>
</div>
<div class="card" style="padding:0;overflow:hidden">
  <div class="gridwrap" id="box"></div>
</div>
<div style="position:sticky;bottom:0;padding:10px 0;z-index:50;background:transparent">
  <div style="display:flex;gap:10px">
    <select id="estado" style="flex:1;margin:0"></select>
    <button class="btn secondary" id="undo" style="flex:0 0 auto;margin:0;width:auto;display:none">Deshacer</button>
    <button class="btn" id="save" style="flex:1;margin:0;width:auto">Guardar</button>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
let D = null, LAST = new Map(), SEL = new Set(), PEND = new Map(), FILTRO = "";
const siguiente = (st) => ESTADOS[(ESTADOS.indexOf(st) + 1) % ESTADOS.length];
const colorAv = (v) => v <= 0 ? "#2A3138" : v < 0.15 ? "#5E3732" : v < 0.55 ? "#6E5620" : v < 0.85 ? "#31567C" : "#245C43";

async function init() {
  D = await api("/api/data", { method:"POST", body: JSON.stringify({ action:"catalogos" }) });
  rebuildLast();
  fill($("#estado"), ESTADOS, (e) => ({ v: e, t: e }));
  fillActividades();
  document.querySelectorAll("#filtros button").forEach((b) => b.onclick = () => {
    FILTRO = b.dataset.modo;
    document.querySelectorAll("#filtros button").forEach((x) => x.classList.toggle("on", x === b));
    SEL.clear(); PEND.clear();
    fillActividades();
  });
  $("#actividad").onchange = () => { SEL.clear(); PEND.clear(); render(); };
  $("#save").onclick = guardar;
  $("#undo").onclick = deshacer;
  render();
}
const actInfoDe = (a) => (D.actividades || []).find((x) => x.CODIGO === a);
const modoDe = (a) => aplicacionDe(actInfoDe(a));
const zonaDeAct = (a) => zonaDe(actInfoDe(a));
const HINTS = {
  UNIDAD: "Toca una celda para avanzar su estado · mantén pulsada para elegir varios apartamentos, incluso de distintos niveles.",
  ZONA: "Esta actividad se ejecuta solo en la zona indicada, presente en cada nivel: márcala nivel a nivel.",
  NIVEL: "Actividad especial: un solo estado para todo el nivel."
};
function fillActividades() {
  const acts = [...new Set(cfgHab().map((r) => r.ACTIVIDAD))].filter((a) => !FILTRO || modoDe(a) === FILTRO)
    .map((c) => actInfoDe(c)).filter(Boolean);
  fill($("#actividad"), acts, (a) => ({ v: a.CODIGO, t: a.CODIGO + " · " + a.NOMBRE }));
  const sel = $("#actividad");
  if (acts.length && (!sel.value || !acts.some((a) => a.CODIGO === sel.value))) sel.value = acts[0].CODIGO;
  render();
}
function rebuildLast() { LAST = new Map(); for (const r of D.registro) { const k = r.ACTIVIDAD + "|" + r.NIVEL + "|" + r.UNIDAD; if (!LAST.has(k) || r.FECHA > LAST.get(k).FECHA) LAST.set(k, r); } }
function cfgHab() { return D.configuracion.filter((r) => r.APLICA === "SI" && r.ACTIVO === "SI" && r.CONTRATISTA && r.CONTRATISTA !== "Sin asignar"); }

function estadoEfectivo(a, n, u) {
  const k = n + "|" + u;
  if (PEND.has(a + "|" + k)) {
    const p = PEND.get(a + "|" + k);
    if (typeof p === "number") return { st: "Manual", pct: Math.round(p) };
    return { st: p, pct: Math.round((VALOR[p] ?? 0) * 100) };
  }
  const last = LAST.get(a + "|" + k);
  if (!last) return { st: "Sin empezar", pct: 0 };
  if (String(last.ESTADO) === "Manual") {
    const v = parseFloat(String(last.VALOR ?? "").replace(",", "."));
    return { st: "Manual", pct: isNaN(v) ? 0 : Math.round(v * 100) };
  }
  return { st: last.ESTADO, pct: Math.round((VALOR[last.ESTADO] ?? 0) * 100) };
}

/* Grid unico: filas = niveles habilitados; columnas segun el ambito de la
   actividad: apartamentos (UNIDAD), la zona fija (ZONA) o todo el nivel. */
function render() {
  const a = $("#actividad").value;
  const box = $("#box");
  if (!a) { box.innerHTML = ""; $("#hintModo").textContent = ""; return; }
  const modo = modoDe(a);
  $("#hintModo").textContent = HINTS[modo] || "";
  const cells = cfgHab().filter((r) => r.ACTIVIDAD === a);
  const niveles = [...new Set(cells.map((r) => r.NIVEL))].sort((x, y) => +x - +y);
  const cols = modo === "UNIDAD"
    ? [...new Set(cells.map((r) => r.UNIDAD))].sort()
    : [modo === "ZONA" ? zonaDeAct(a) : "NIVEL"];
  let html = "<table class='grid'><tr><th>NIVEL</th><th>AV.</th>" +
    cols.map((c) => `<th>${esc(modo === "NIVEL" ? "Todo el nivel" : c)}</th>`).join("") + "</tr>";
  for (const n of niveles) {
    const vals = []; let tds = "";
    for (const u of cols) {
      const c = cells.find((r) => r.NIVEL === n && r.UNIDAD === u);
      if (!c) { tds += "<td></td>"; continue; }
      tds += celdaRegistro(a, n, u, vals);
    }
    html += filaConAvance(n, vals, tds);
  }
  html += "</table>";
  box.innerHTML = html;
  wireCeldas();
}

function celdaRegistro(a, n, u, vals) {
  const ef = estadoEfectivo(a, n, u);
  vals.push(ef.pct / 100);
  const k = n + "|" + u;
  const pend = PEND.has(a + "|" + k);
  const etiqueta = ef.st === "Manual" ? "MAN" : ef.st.substring(0, 3);
  const listo = ef.pct >= 100;
  return `<td><div class='cell ${SEL.has(k) ? "sel" : ""} ${pend ? "pend" : ""}' data-k='${esc(k)}' data-st='${esc(ef.st)}'>` +
    `<button type='button' class='done ${listo ? "on" : ""}' title='Realizado'>${listo ? "✓" : ""}</button>` +
    `<span class='chip' style='background:${colorAv(ef.pct / 100)};color:#EAF0F6'>${esc(etiqueta)}</span>` +
    `<span class='pct' title='Porcentaje manual'>${ef.pct}%</span>` +
    `</div></td>`;
}

function filaConAvance(n, vals, tds) {
  const avg = vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0;
  return `<tr><td class='lvl'>${esc(n)}</td>` +
    `<td><div class='avbar'><i style='width:${Math.round(avg * 100)}%;background:${colorAv(avg)}'></i></div>` +
    `<span style='font-size:11px;color:var(--mut)'>${Math.round(avg * 100)}%</span></td>` + tds + "</tr>";
}

function wireCeldas() {

  $("#box").querySelectorAll("div.cell").forEach((el) => {
    let timer = null, largo = false;
    const k = el.dataset.k;
    el.addEventListener("touchstart", () => { largo = false; timer = setTimeout(() => { largo = true; toggleSel(k); }, 450); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach((ev) => el.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); toggleSel(k); });
    el.querySelector(".done").addEventListener("click", (e) => {
      e.stopPropagation();
      const a = $("#actividad").value;
      const [n, u] = k.split("|");
      const actual = estadoEfectivo(a, n, u);
      PEND.set(a + "|" + k, actual.pct >= 100 ? "Sin empezar" : "Listo");
      SEL.delete(k);
      render();
    });
    el.querySelector(".pct").addEventListener("click", (e) => {
      e.stopPropagation();
      clearTimeout(timer);
      const a = $("#actividad").value;
      const [n, u] = k.split("|");
      const actual = estadoEfectivo(a, n, u);
      const entrada = prompt("Porcentaje de avance (0-100) para " + n + "/" + u + ":", String(actual.pct));
      if (entrada === null) return;
      const v = parseFloat(entrada.replace(",", "."));
      if (isNaN(v) || v < 0 || v > 100) { alert("Porcentaje inválido."); return; }
      PEND.set(a + "|" + k, Math.round(v));
      SEL.delete(k);
      render();
    });
    el.addEventListener("click", () => {
      if (largo) { largo = false; return; }
      ciclar(k, el.dataset.st);
    });
  });
  updateBadges();
}

function ciclar(k, stActual) {
  const a = $("#actividad").value;
  const [n, u] = k.split("|");
  const ef = estadoEfectivo(a, n, u);
  const bucket = ef.pct >= 100 ? "Listo" : ef.pct >= 80 ? "En remate" : ef.pct >= 50 ? "En curso" : ef.pct >= 10 ? "En replanteo" : "Sin empezar";
  const nuevo = siguiente(bucket);
  PEND.set(a + "|" + k, nuevo);
  SEL.delete(k);
  render();
}

function toggleSel(k) {
  SEL.has(k) ? SEL.delete(k) : SEL.add(k);
  render();
}

function updateBadges() {
  const pb = $("#pend-badge"), sb = $("#sel-badge");
  if (PEND.size) { pb.style.display = "inline-block"; pb.textContent = PEND.size + " cambio" + (PEND.size > 1 ? "s" : "") + " sin guardar"; }
  else pb.style.display = "none";
  if (SEL.size) { sb.style.display = "inline-block"; sb.textContent = "Sel: " + SEL.size; }
  else sb.style.display = "none";
  $("#undo").style.display = PEND.size ? "" : "none";
}

function deshacer() { PEND.clear(); render(); }

async function guardar() {
  const a = $("#actividad").value;
  if (!a) return;
  if (!PEND.size && !SEL.size) { alert("No hay cambios que guardar."); return; }
  const sampleDe = (act) => cfgHab().find((r) => r.ACTIVIDAD === act);
  let items = [];
  for (const [ak, p] of PEND) {
    const i1 = ak.indexOf("|"), i2 = ak.indexOf("|", i1 + 1);
    const actId = ak.slice(0, i1), n = ak.slice(i1 + 1, i2), u = ak.slice(i2 + 1);
    const s = sampleDe(actId); if (!s) continue;
    const base = { proyecto: s.PROYECTO, torre: s.TORRE, actividad: actId, nivel: n, unidad: u };
    items.push(typeof p === "number" ? { ...base, pct: p } : { ...base, estado: p });
  }
  if (SEL.size) {
    const est = $("#estado").value;
    if (!est) { alert("Elige el estado para las unidades seleccionadas."); return; }
    const s = sampleDe(a); if (!s) { alert("Actividad no habilitada."); return; }
    for (const k of SEL) {
      const [n, u] = k.split("|");
      items.push({ proyecto: s.PROYECTO, torre: s.TORRE, actividad: a, nivel: n, unidad: u, estado: est });
    }
  }
  const btn = $("#save"); btn.disabled = true; btn.textContent = "...";
  const d = await api("/api/data", { method:"POST", body: JSON.stringify({ action:"registro-save", items }) });
  btn.disabled = false; btn.textContent = "Guardar";
  if (d.success) {
    alert(d.offline ? "Guardado offline (" + items.length + "). Se sincronizará al haber señal." : "Registrado correctamente (" + d.registrados + ").");
    PEND.clear(); SEL.clear();
    D = await api("/api/data", { method:"POST", body: JSON.stringify({ action:"catalogos" }) }); rebuildLast(); render();
  }
}
init();
</script>
</body>
</html>
